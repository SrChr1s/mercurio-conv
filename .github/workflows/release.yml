name: Release

# Publica una Release con los paquetes de Windows y Linux al subir una etiqueta vX.Y.Z:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.0
  NFPM_VERSION: v2.48.0
  APPIMAGETOOL_VERSION: 1.9.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # main.go embeds frontend/dist, which is not in the repo: build it before vet.
      - run: cd frontend && npm ci && npm run check && npm run build
      - run: go vet -tags webkit2_41 ./...
      - run: go test ./...

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # desktop-file-utils: appimagetool validates the .desktop file with desktop-file-validate
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils
      - run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
      - name: appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"   # los runners no tienen FUSE
      - run: VERSION="${GITHUB_REF_NAME#v}" scripts/package.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*
            !dist/SHA256SUMS*

  windows:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y nsis zip
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - run: VERSION="${GITHUB_REF_NAME#v}" scripts/package.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*
            !dist/SHA256SUMS*

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Mercurio ${GITHUB_REF_NAME#v}" --generate-notes
